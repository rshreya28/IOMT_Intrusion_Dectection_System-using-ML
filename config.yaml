# --- Federated learning ---
num_clients: 5              # simulated devices/hospitals
local_epochs: 2             # epochs each client trains per round
federated_rounds: 20
client_lr: 0.001
batch_size: 64

# --- Model ---
input_dim: 20                # number of features after feature extraction (edit to match your dataset)
hidden_dim: 16                # small on purpose -> stays deployable on constrained devices
latent_dim: 8

# --- Drift detection ---
drift_detector: adwin
drift_delta: 0.002            # ADWIN sensitivity (lower = more sensitive)

# --- Explainability ---
shap_background_samples: 100  # samples used as SHAP baseline
top_k_reasons: 3              # how many features to show per alert

# --- Data ---
dataset: edge_iiotset          # options: edge_iiotset, medbiot, ton_iot
data_dir: data/raw
train_test_split: 0.8
